[package]
name = "open-data-license"
version = "0.1.0"
description = "Open data license enum (CC, ODC) with SPDX IDs and compatibility rules"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://codeberg.org/caniko/open-data-license"
documentation = "https://docs.rs/open-data-license"
readme = "README.md"
keywords = ["license", "data", "spdx", "metadata", "fair"]
categories = ["data-structures", "science"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  "src/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
utoipa = ["dep:utoipa"]
