[package]
name = "open-data-license"
version = "0.1.0"
description = "Open data license enum (CC, ODC) with SPDX IDs and compatibility rules"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
strum = { version = "=0.28.0", features = ["derive"] }
utoipa = { version = "=5.4.0", features = ["axum_extras", "uuid", "chrono"] }

[dev-dependencies]
serde_json = "=1.0.149"
