description = "Expose SPDX identifiers, canonical rights URIs, and display names for scientific and research datasets."

[[pages.sections.features]]
title = "Compatibility helpers"
description = "Check whether two dataset licenses can be combined and select the more restrictive compatible result."
highlight = true

[[pages.sections.features]]
title = "Open-data coverage"
description = "Cover Creative Commons, Open Data Commons, CDLA, and public-domain license families in one typed enum."

[[pages.sections.features]]
title = "Stable Rust API"
description = "Use serde round-tripping by enum identifier, SPDX parsing, and optional OpenAPI schemas through the utoipa feature."

[[pages.sections.features]]
title = "Rights made explicit"
description = "Surface the underlying SPDX identifier and rights URI so downstream users can review the actual license terms."

[[pages.sections.features]]
title = "Research-ready metadata"
description = "Keep license decisions visible in scientific and research dataset combination workflows without providing legal advice."

