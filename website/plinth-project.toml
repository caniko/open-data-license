type = "workflow_steps"
id = "usage"
heading = "From license to compatibility check"
intro = "Keep license decisions explicit in dataset workflows: choose a typed value, expose its canonical metadata, then check combinations conservatively."

[[pages.sections.steps]]
title = "Choose a license"
description = "let license = DataLicense::CcBySa;"

[[pages.sections.steps]]
title = "Expose metadata"
description = "license.spdx_id() and license.rights_uri()"

[[pages.sections.steps]]
title = "Check the combination"
description = "Compare it with another supported license."
