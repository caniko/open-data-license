# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Run om ci
        env:
          OMNIX_REF: 'github:juspay/omnix/v1.3.2'
        run: nix run "$OMNIX_REF" -- ci run

      - name: Install cargo-audit
        run: nix develop -c cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: nix develop -c cargo install cargo-deny --locked --version 0.18.3

      - name: Check MSRV
        run: nix develop -c cargo +1.85 check --all-targets

      - name: Audit dependencies
        run: nix develop -c cargo audit

      - name: Deny dependency policy
        run: nix develop -c cargo deny check bans licenses sources

      - name: Build docs
        run: nix develop -c cargo doc --no-deps --all-features
