name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Check flake
        run: nix flake check

      - name: Test
        run: nix develop -c cargo test

      - name: Install cargo-audit
        run: nix develop -c cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: nix develop -c cargo install cargo-deny --locked

      - name: Check MSRV
        run: nix develop -c cargo +1.85 check --all-targets

      - name: Audit dependencies
        run: nix develop -c cargo audit

      - name: Deny dependency policy
        run: nix develop -c cargo deny check

      - name: Build docs
        run: nix develop -c cargo doc --no-deps --all-features

      - name: Clippy
        run: nix develop -c cargo clippy --all-targets -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package --allow-dirty
