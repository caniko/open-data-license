name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: atlas
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:uqr0nD3I0mfj9BYfZgTZHMaDKfI2yCTtSA5JGTWKUeg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Nix flake check
        run: nix flake check --keep-going --print-build-logs

      - name: Cargo package list
        run: nix develop -c cargo package --list

      - name: Cargo publish dry-run
        run: nix develop -c cargo publish --dry-run

      - name: Cargo deny
        run: nix develop -c cargo deny check

      - name: Cargo audit
        run: nix develop -c cargo audit
