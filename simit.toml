[ci]
runtime = "nix"
runner = "ubuntu-24.04"
with_msrv = true
with_audit = true
with_deny = true
with_docs = true
om_ci = true
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
om_ci_augment = true
provider = "actions"
platform = "github"
publish_crates = true
all_features = false

[ci.pages]
repo = "caniko/open-data-license"
canonical_domain = "open-data-license.tartanoglu.com"
